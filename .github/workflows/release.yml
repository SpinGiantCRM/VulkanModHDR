name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional mod version override (falls back to gradle.properties when omitted)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve build version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION=""
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            VERSION="${TAG#v}"
          elif [ -n "${{ github.event.inputs.version || '' }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="$(sed -n 's/^[[:space:]]*mod_version[[:space:]]*=[[:space:]]*//p' gradle.properties | head -n1)"
          fi

          if [ -z "${VERSION}" ]; then
            echo "Failed to resolve VERSION." >&2
            exit 1
          fi

          echo "Resolved VERSION=${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          chmod +x ./gradlew
          VERSION="${{ steps.version.outputs.version }}"
          echo "Building with VERSION=${VERSION}"
          ./gradlew build -Pmod_version="$VERSION"

      - name: Collect release files
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          jars=(build/libs/VulkanModHDR_*.jar)
          release_jars=()
          for jar in "${jars[@]}"; do
            case "$jar" in
              *-sources.jar|*-dev.jar|*-client.jar|*intermediary*|*.tmp.jar)
                continue
                ;;
              *)
                release_jars+=("$jar")
                ;;
            esac
          done

          if [ ${#release_jars[@]} -eq 0 ]; then
            echo "No release jar matching build/libs/VulkanModHDR_*.jar found." >&2
            exit 1
          fi

          if [ ${#release_jars[@]} -gt 1 ]; then
            echo "Expected exactly one main release jar, found ${#release_jars[@]}:" >&2
            printf ' - %s\n' "${release_jars[@]}" >&2
            exit 1
          fi

          {
            echo 'files<<EOF'
            printf '%s\n' "${release_jars[0]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload assets to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.collect.outputs.files }}
          fail_on_unmatched_files: true
