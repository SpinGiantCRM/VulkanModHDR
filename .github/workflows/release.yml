name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Collect release files
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          jars=(build/libs/VulkanModHDR_*.jar)
          release_jars=()
          for jar in "${jars[@]}"; do
            case "$jar" in
              *-sources.jar|*-dev.jar|*-client.jar|*intermediary*|*.tmp.jar)
                continue
                ;;
              *)
                release_jars+=("$jar")
                ;;
            esac
          done

          if [ ${#release_jars[@]} -eq 0 ]; then
            echo "No release jar matching build/libs/VulkanModHDR_*.jar found." >&2
            exit 1
          fi

          sources_jars=(build/libs/*-sources.jar)
          files=("${release_jars[@]}")
          if [ ${#sources_jars[@]} -gt 0 ]; then
            files+=("${sources_jars[0]}")
          fi

          {
            echo 'files<<EOF'
            printf '%s\n' "${files[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload assets to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.collect.outputs.files }}
          fail_on_unmatched_files: true
