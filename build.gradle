plugins {
	id 'net.fabricmc.fabric-loom' version '1.15.5'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	accessWidenerPath = file("src/main/resources/vulkanmod.accesswidener")
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API modules pinned to upstream 26.1.x 0.6.5 jar line.
	[
		"net.fabricmc.fabric-api:fabric-api-base:2.0.3+ece06323b3",
		"net.fabricmc.fabric-api:fabric-block-getter-api-v2:2.0.6+ec56b601b3",
		"net.fabricmc.fabric-api:fabric-lifecycle-events-v1:4.0.6+a9b9c176b3",
		"net.fabricmc.fabric-api:fabric-renderer-api-v1:13.0.0+c80601bbb3",
		"net.fabricmc.fabric-api:fabric-rendering-fluids-v1:6.0.1+d871b99eb3",
		"net.fabricmc.fabric-api:fabric-rendering-v1:23.0.4+c7e428fdb3",
		"net.fabricmc.fabric-api:fabric-resource-loader-v0:3.3.16+4fc5413fb3",
		"net.fabricmc.fabric-api:fabric-resource-loader-v1:2.0.9+d871b99eb3",
		"net.fabricmc.fabric-api:fabric-transitive-access-wideners-v1:8.0.11+d871b99eb3"
	].each { module ->
		implementation(module)
		include(module)
	}
}

project.ext.lwjglVersion = "3.4.1"
project.ext.jomlVersion = "1.10.4"
project.ext.winNatives = "natives-windows"
project.ext.linuxNatives = "natives-linux"
project.ext.macosNatives = "natives-macos"
project.ext.macosArmNatives = "natives-macos-arm64"

dependencies {
	include(implementation("org.lwjgl:lwjgl-vulkan:$lwjglVersion"))

	ext.includeNatives = { name ->
		include(implementation("$name:$lwjglVersion"))
		include(runtimeOnly("$name:$lwjglVersion:$winNatives"))
		include(runtimeOnly("$name:$lwjglVersion:$linuxNatives"))
		include(runtimeOnly("$name:$lwjglVersion:$macosNatives"))
		include(runtimeOnly("$name:$lwjglVersion:$macosArmNatives"))
	}

	includeNatives("org.lwjgl:lwjgl-vma")
	includeNatives("org.lwjgl:lwjgl-shaderc")

	//MoltenVK
	include(runtimeOnly("org.lwjgl:lwjgl-vulkan:$lwjglVersion:$macosNatives"))
	include(runtimeOnly("org.lwjgl:lwjgl-vulkan:$lwjglVersion:$macosArmNatives"))
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

dependencies {
	testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
}


tasks.named("test") {
	useJUnitPlatform()
}



